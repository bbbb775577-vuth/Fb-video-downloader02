<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Video Downloader</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- ========== RESPONSIVE GREEN MENU BAR ========== -->
    <header class="bg-[#10b981] text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            
            <!-- Logo / Brand Name -->
            <a href="index.html" class="text-lg md:text-xl font-bold tracking-wide flex items-center gap-2">
                📥 SaveFB.com
            </a>

            <!-- Desktop Menu Links -->
            <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
                <a href="index.html" class="hover:text-emerald-100 transition">Home</a>
                <a href="fb_download_video.html" class="hover:text-emerald-100 transition">Download Facebook Video</a>
                <a href="#help" class="hover:text-emerald-100 transition">Help</a>
            </nav>

            <!-- Mobile Menu Button (Hamburger) -->
            <button id="menuToggle" class="md:hidden text-white focus:outline-none text-2xl">
                ☰
            </button>
        </div>

        <!-- Mobile Dropdown Menu -->
        <div id="mobileMenu" class="hidden md:hidden bg-[#059669] px-4 pt-2 pb-4 space-y-2 border-t border-emerald-500">
            <a href="index.html" class="block py-2 text-sm hover:bg-emerald-600 rounded px-2 transition">Home</a>
            <a href="fb_download_video.html" class="block py-2 text-sm hover:bg-emerald-600 rounded px-2 transition">Download Facebook Video</a>
            <a href="#help" class="block py-2 text-sm hover:bg-emerald-600 rounded px-2 transition">Help</a>
        </div>
    </header>

    <!-- ========== MAIN CONTENT CONTAINER ========== -->
    <main class="flex-grow flex justify-center pt-12 p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg text-center h-fit">
            <h1 class="text-2xl font-bold text-blue-600 mb-2">📥 Facebook Video Downloader</h1>
            <p class="text-gray-500 mb-6 text-sm">Paste your Video link or Reel link below.</p>

            <!-- Form សម្រាប់ Paste Link -->
            <div class="flex flex-col gap-4">
                
                <!-- Container សម្រាប់ Input និងប៊ូតុង Paste បញ្ចូលគ្នា -->
                <div class="relative flex items-center w-full">
                    <input type="url" id="videoUrl" placeholder="https://www.facebook.com/watch?v=..." 
                        class="w-full px-4 py-3 pr-20 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">

                    <button type="button" id="pasteBtn" 
                        class="absolute right-2 px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-medium rounded-md transition duration-200 cursor-pointer">
                    📋 Paste
                    </button>
                </div>
                
                <button onclick="getDownloadLink()" id="downloadBtn"
                    class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition duration-300 shadow-md cursor-pointer">
                    Download
                </button>
            </div>

            <!-- Loading Spinner -->
            <div id="loading" class="hidden mt-6 text-blue-600 font-semibold">
                Processing Please Wait... ⏳
            </div>

            <!-- លទ្ធផលក្រោយពេលទាញយកបាន (រក្សាទម្រង់ដើមតាមកូដចាស់របស់អ្នក) -->
            <div id="resultContainer" class="hidden mt-6 p-4 border border-green-200 bg-green-50 rounded-lg text-left">
                <div class="flex gap-4 items-center mb-4">
                    <!-- Thumbnail វីដេអូ -->
                    <img id="videoThumbnail" src="" alt="Thumbnail" class="w-28 h-20 object-cover rounded-md border border-gray-300 shrink-0">
                    
                    <!-- ចំណងជើងវីដេអូ -->
                    <p id="videoTitle" class="font-bold text-gray-800 text-sm line-clamp-3 overflow-hidden text-ellipsis"></p>
                </div>

                <button id="downloadLinkBtn" onclick="downloadVideoFile()" 
                    class="w-full block text-center bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700 transition duration-300 text-sm cursor-pointer shadow">
                    Click here to Save your video 💾
                </button>
            </div>
        </div>
    </main>

    <!-- ========== JAVASCRIPT LOGIC ========== -->
    <script>
        // Toggle Mobile Menu
        const menuToggle = document.getElementById('menuToggle');
        const mobileMenu = document.getElementById('mobileMenu');

        menuToggle.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        let directVideoUrl = ""; 
        let currentVideoTitle = "facebook-video";

        // Function សម្រាប់បម្លែងអក្សរ Unicode Entities ឱ្យទៅជាអក្សរធម្មតាវិញ
        function decodeEntities(encodedString) {
            const parser = new DOMParser();
            const dom = parser.parseFromString(`<!doctype html><body>${encodedString}`, 'text/html');
            return dom.body.textContent;
        }

        async function getDownloadLink() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('resultContainer');
            const videoTitle = document.getElementById('videoTitle');
            const videoThumbnail = document.getElementById('videoThumbnail');

            if (!urlInput) {
                alert('Please insert your Link !');
                return;
            }

            loading.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            try {
                const response = await fetch('https://fb-video-downloader02.onrender.com/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });

                const data = await response.json();

                if (response.ok) {
                    loading.classList.add('hidden');
                    resultContainer.classList.remove('hidden');
                    
                    const rawTitle = data.title || "Facebook Video";
                    currentVideoTitle = decodeEntities(rawTitle);
                    videoTitle.innerText = currentVideoTitle;
                    
                    // បង្ហាញ Thumbnail (តាមកូដចាស់)
                    if (data.thumbnail) {
                        videoThumbnail.src = data.thumbnail;
                    } else if (data.cover) {
                        videoThumbnail.src = data.cover;
                    } else {
                        videoThumbnail.src = "https://via.placeholder.com/150";
                    }

                    directVideoUrl = data.downloadUrl; 
                } else {
                    loading.classList.add('hidden');
                    alert(data.error || 'Any problem!');
                }
            } catch (error) {
                loading.classList.add('hidden');
                alert('Can not connect to Server !');
                console.error(error);
            }
        }

        function downloadVideoFile() {
            if (!directVideoUrl) return;
            
            // កាត់អក្សរខុសច្បាប់ចេញពីឈ្មោះ File
            let safeTitle = currentVideoTitle.replace(/[/\\?%*:|"<>]/g, '').trim();
            if (!safeTitle) safeTitle = "facebook-video";

            // បញ្ជូន filename ទៅកាន់ server.js
            const proxyUrl = `https://fb-video-downloader02.onrender.com/api/proxy-download?url=${encodeURIComponent(directVideoUrl)}&filename=${encodeURIComponent(safeTitle)}`;
            
            const a = document.createElement('a');
            a.href = proxyUrl;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        document.getElementById('pasteBtn').addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                const inputField = document.getElementById('videoUrl');
                inputField.value = text;
            } catch (err) {
                alert('មិនអាច Paste បានទេ សូមអនុញ្ញាតសិទ្ធិ Clipboard លើ Browser របស់អ្នកជាមុនសិន!');
                console.error('Failed to read clipboard contents: ', err);
            }
        });
    </script>

</body>
</html>
