<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Video Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg text-center">
        <h1 class="text-2xl font-bold text-blue-600 mb-2">📥 Facebook Video Downloader</h1>
        <p class="text-gray-500 mb-6 text-sm">បិទ (Paste) Link វីដេអូ ឬ Reel ពី Facebook ទីនេះដើម្បីទាញយក</p>

        <!-- Form សម្រាប់ Paste Link -->
        <div class="flex flex-col gap-4">
            <input type="url" id="videoUrl" placeholder="https://www.facebook.com/watch?v=..." 
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            
            <button onclick="getDownloadLink()" id="downloadBtn"
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition duration-300 shadow-md">
                ទាញយកវីដេអូ (Download)
            </button>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="hidden mt-6 text-blue-600 font-semibold">
            កំពុងដំណើរការ សូមរង់បន្តិច... ⏳
        </div>

        <!-- លទ្ធផលក្រោយពេលទាញយកបាន -->
        <div id="resultContainer" class="hidden mt-6 p-4 border border-green-200 bg-green-50 rounded-lg text-left">
            <p id="videoTitle" class="font-bold text-gray-700 mb-2 text-sm"></p>
            <!-- ប្រើប្រាស់ onclick ដើម្បីบังคับ download ដោយផ្ទាល់មិនឱ្យបើក tab ថ្មី -->
            <button id="downloadLinkBtn" onclick="downloadVideoFile()" 
                class="w-full block text-center bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700 transition duration-300 text-sm cursor-pointer">
                ចុចទីនេះដើម្បី Save វីដេអូ 💾
            </button>
        </div>
    </div>

    <script>
        let directVideoUrl = ""; // ប្រមូលផ្ដុំ Link វីដេអូសុទ្ធ

        async function getDownloadLink() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('resultContainer');
            const videoTitle = document.getElementById('videoTitle');

            if (!urlInput) {
                alert('សូមបញ្ចូល Link វីដេអូជាមុនសិន!');
                return;
            }

            loading.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            try {
                const response = await fetch('http://savett7.com/fb_download_video/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });

                const data = await response.json();

                if (response.ok) {
                    loading.classList.add('hidden');
                    resultContainer.classList.remove('hidden');
                    
                    videoTitle.innerText = data.title;
                    directVideoUrl = data.downloadUrl; // រកទុក Link .mp4
                } else {
                    loading.classList.add('hidden');
                    alert(data.error || 'មានបញ្តាកើតឡើង!');
                }
            } catch (error) {
                loading.classList.add('hidden');
                alert('មិនអាចតភ្ជាប់ទៅកាន់ Server បានទេ!');
                console.error(error);
            }
        }

        // Function សម្រាប់បញ្ជា Download ចូលម៉ាស៊ីនផ្ទាល់
// Function សម្រាប់បញ្ជា Download ຜ່ານ Server Proxy ផ្ទាល់
        function downloadVideoFile() {
            if (!directVideoUrl) return;
            
            // បញ្ជូន Link ទៅកាន់ Backend Proxy ដើម្បីบังคับ Download ចូលម៉ាស៊ីន
            const proxyUrl = `http://savett7.com/fb_download_video/api/proxy-download?url=${encodeURIComponent(directVideoUrl)}`;
            
            // បង្កើត a tag បណ្តោះអាសន្នដើម្បី trigger ការ download
            const a = document.createElement('a');
            a.href = proxyUrl;
            a.setAttribute('download', 'facebook-video.mp4');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>

</body>
</html>
